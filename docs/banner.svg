<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-label="SDB Connect — Connect. Grow. Sustain.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D4066"/>
      <stop offset="55%" stop-color="#0A3352"/>
      <stop offset="100%" stop-color="#082A44"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12B1C6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#12B1C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34B889" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34B889" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#031725" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="260" fill="url(#glow1)"/>
  <circle cx="180" cy="380" r="220" fill="url(#glow2)"/>

  <!-- network motif, right side -->
  <g stroke="#12B1C6" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="2 5">
    <line x1="960" y1="130" x2="1090" y2="70"/>
    <line x1="960" y1="130" x2="1010" y2="230"/>
    <line x1="1010" y1="230" x2="1150" y2="190"/>
    <line x1="1090" y1="70" x2="1230" y2="120"/>
    <line x1="1150" y1="190" x2="1230" y2="120"/>
    <line x1="1150" y1="190" x2="1120" y2="310"/>
    <line x1="1230" y1="120" x2="1300" y2="230"/>
    <line x1="1010" y1="230" x2="900" y2="300"/>
  </g>
  <g>
    <circle cx="960" cy="130" r="19" fill="#0D4066" stroke="#12B1C6" stroke-width="2"/>
    <circle cx="1090" cy="70" r="15" fill="#12B1C6"/>
    <circle cx="1010" cy="230" r="17" fill="#0074AE"/>
    <circle cx="1150" cy="190" r="13" fill="#34B889"/>
    <circle cx="1230" cy="120" r="16" fill="#70154C"/>
    <circle cx="1300" cy="230" r="12" fill="#F0693E"/>
    <circle cx="1120" cy="310" r="14" fill="#0074AE"/>
    <circle cx="900" cy="300" r="11" fill="#12B1C6"/>
  </g>

  <!-- wordmark lockup -->
  <g transform="translate(90, 118)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#12B1C6" filter="url(#soft)"/>
    <text x="32" y="44" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="30" font-weight="800" fill="#0D4066" text-anchor="middle">S</text>
  </g>

  <text x="90" y="248" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF">SDB Connect</text>
  <text x="94" y="284" font-family="'Tajawal', Arial, sans-serif" font-size="22" font-weight="500" fill="#7FD4E0">وصل</text>

  <text x="90" y="330" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="27" font-weight="600" fill="#5FD3E8">
    Connect. <tspan fill="#6BDDB0">Grow.</tspan> <tspan fill="#F0A88C">Sustain.</tspan>
  </text>

  <text x="90" y="368" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16.5" fill="#B9CBD6">
    From financing people to connecting an ecosystem — an AI-powered beneficiary network for the Social Development Bank.
  </text>

  <text x="90" y="60" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#5FD3E8">AI &amp; EMERGING TECHNOLOGIES · IMPACTX HACKATHON</text>
</svg>
